<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 냉장고 셰프: a cream fridge in a chef's hat on teal. Everything sits inside the 205px safe circle. -->
  <rect width="512" height="512" fill="#1f6f62"/>
  <ellipse cx="256" cy="408" rx="96" ry="12" fill="#17574d"/>
  <!-- legs -->
  <rect x="196" y="388" width="18" height="20" rx="5" fill="#d9cdb6"/>
  <rect x="298" y="388" width="18" height="20" rx="5" fill="#d9cdb6"/>
  <!-- body -->
  <rect x="172" y="146" width="168" height="250" rx="30" fill="#fff6e6"/>
  <rect x="172" y="146" width="168" height="250" rx="30" fill="none" stroke="#e9dcc3" stroke-width="4"/>
  <path d="M172 228 H340" stroke="#e3d4b8" stroke-width="5"/>
  <!-- handles -->
  <rect x="306" y="172" width="11" height="38" rx="5.5" fill="#f2a541"/>
  <rect x="306" y="248" width="11" height="58" rx="5.5" fill="#f2a541"/>
  <!-- face -->
  <circle cx="226" cy="300" r="9" fill="#24302d"/>
  <circle cx="276" cy="300" r="9" fill="#24302d"/>
  <circle cx="229" cy="297" r="3" fill="#fff6e6"/>
  <circle cx="279" cy="297" r="3" fill="#fff6e6"/>
  <path d="M236 322 Q251 336 266 322" fill="none" stroke="#24302d" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="208" cy="324" rx="11" ry="7" fill="#f28b74" opacity=".75"/>
  <ellipse cx="294" cy="324" rx="11" ry="7" fill="#f28b74" opacity=".75"/>
  <!-- chef's hat -->
  <rect x="204" y="118" width="104" height="36" rx="8" fill="#ffffff"/>
  <path d="M222 118 V150 M244 118 V150 M268 118 V150 M290 118 V150" stroke="#e6ece9" stroke-width="3"/>
  <circle cx="216" cy="100" r="30" fill="#ffffff"/>
  <circle cx="296" cy="100" r="30" fill="#ffffff"/>
  <circle cx="256" cy="84" r="38" fill="#ffffff"/>
  <rect x="204" y="96" width="104" height="30" fill="#ffffff"/>
  <!-- a sprig of green onion tucked in the hat band -->
  <path d="M300 130 L326 84" stroke="#6fbf5a" stroke-width="7" stroke-linecap="round"/>
  <path d="M300 130 L336 98" stroke="#8bd174" stroke-width="6" stroke-linecap="round"/>
</svg>
