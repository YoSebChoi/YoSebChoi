# Rebuilds 노포 지도 (docs/matjip) whenever its data or page changes:
# looks up coordinates for new addresses and commits the result back.
# Optional: add a repository secret KAKAO_REST_KEY (Kakao Developers REST API key)
# for accurate Korean address lookup; without it OpenStreetMap is used.
name: 노포 지도 데이터 빌드

on:
  push:
    paths:
      - "matjip/**"
      - ".github/workflows/matjip-data.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matjip-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Geocode and build
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: python3 matjip/build.py
      - name: Commit the built map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/matjip matjip/data/geocode_cache.json
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "matjip: rebuild map data"
          git push
