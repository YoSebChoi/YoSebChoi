# temporary: how many places Kakao's TV tags give for each keyword
name: probe sources
on:
  push:
    paths: [".github/workflows/probe-sources.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for q in "백반기행" "허영만" "식객 허영만의 백반기행" "허영만의 백반기행" "식객" "백반 기행" "허영만 맛집"; do
            echo "== $q"
            curl -sS -G -H "Authorization: KakaoAK ${{ secrets.KAKAO_REST_KEY }}" --data-urlencode "query=$q" --data size=15 "https://dapi.kakao.com/v2/local/search/keyword.json" \
              | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['meta']['total_count']);[print('  ',x['place_name'],'|',x['address_name'],'|',x['category_name']) for x in d['documents'][:6]]"
          done
