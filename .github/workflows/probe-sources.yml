# temporary: look at the map tiles the app gets
name: probe sources
on:
  push:
    paths: [".github/workflows/probe-sources.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          get() { curl -sS -m 20 -H "Referer: https://yosebchoi.github.io/" -A "Mozilla/5.0 (Linux; Android 14) Chrome/126 Mobile" -D /tmp/h -o /tmp/t "$1"; echo "== $(head -1 /tmp/h | tr -d '\r') $(stat -c %s /tmp/t) $1"; grep -i "^x-\|^cache\|^server" /tmp/h | tr -d '\r' | head -5; echo "B64:$2:$(base64 -w0 /tmp/t)"; }
          get "https://a.basemaps.cartocdn.com/rastertiles/voyager/14/13970/6345.png" voyager
          get "https://a.basemaps.cartocdn.com/dark_all/14/13970/6345.png" dark
          get "https://a.basemaps.cartocdn.com/light_all/14/13970/6345.png" light
          get "https://tile.openstreetmap.org/14/13970/6345.png" osm
