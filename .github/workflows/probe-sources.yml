# temporary: check the map tile and library URLs the app loads
name: probe sources
on:
  push:
    paths: [".github/workflows/probe-sources.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in \
            "https://a.basemaps.cartocdn.com/rastertiles/voyager/14/13970/6345.png" \
            "https://a.basemaps.cartocdn.com/rastertiles/dark_all/14/13970/6345.png" \
            "https://a.basemaps.cartocdn.com/dark_all/14/13970/6345.png" \
            "https://a.basemaps.cartocdn.com/rastertiles/voyager/14/13970/6345@2x.png" \
            "https://a.basemaps.cartocdn.com/dark_all/14/13970/6345@2x.png" \
            "https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css" \
            "https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" \
            "https://yosebchoi.github.io/YoSebChoi/matjip/" \
            "https://yosebchoi.github.io/YoSebChoi/matjip/stores.json" ; do
            curl -sS -o /tmp/o -w "%{http_code} %{content_type} %{size_download}  $u\n" -m 20 "$u" || echo "fail $u"
          done
          curl -sS https://yosebchoi.github.io/YoSebChoi/matjip/ | grep -o 'cartocdn[^`"]*' | head
