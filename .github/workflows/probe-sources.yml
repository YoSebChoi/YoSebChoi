# temporary: checks which 백반기행 data sources a GitHub runner can reach
name: probe sources
on:
  push:
    paths: [".github/workflows/probe-sources.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/126 Mobile Safari/537.36"
          for u in \
            "https://namu.wiki/w/%EC%8B%9D%EA%B0%9D%20%ED%97%88%EC%98%81%EB%A7%8C%EC%9D%98%20%EB%B0%B1%EB%B0%98%EA%B8%B0%ED%96%89/%EB%B0%A9%EC%98%81%20%EB%AA%A9%EB%A1%9D" \
            "https://ko.wikipedia.org/w/index.php?title=%EC%8B%9D%EA%B0%9D_%ED%97%88%EC%98%81%EB%A7%8C%EC%9D%98_%EB%B0%B1%EB%B0%98%EA%B8%B0%ED%96%89%EC%9D%98_%EC%97%90%ED%94%BC%EC%86%8C%EB%93%9C_%EB%AA%A9%EB%A1%9D&action=raw" \
            "https://bangsongmatzip.com/%EB%B0%B1%EB%B0%98%EA%B8%B0%ED%96%89-%EB%A7%9B%EC%A7%91%EC%A7%80%EB%8F%84/" \
            "https://program.tvchosun.com/" \
            "https://www.diningcode.com/list.dc?query=%EC%8B%9D%EA%B0%9D%ED%97%88%EC%98%81%EB%A7%8C%EC%9D%98%EB%B0%B1%EB%B0%98%EA%B8%B0%ED%96%89" \
            "https://map.naver.com/p/search/%EB%B0%B1%EB%B0%98%EA%B8%B0%ED%96%89" \
            "https://dapi.kakao.com/v2/local/search/keyword.json?query=%EB%B0%B1%EB%B0%98%EA%B8%B0%ED%96%89" ; do
            code=$(curl -sS -L -A "$UA" -o /tmp/p.html -w "%{http_code} %{size_download}" -m 30 "$u" || echo fail)
            echo "== $code $u"
            sed -e 's/<[^>]*>/ /g' /tmp/p.html | tr -s ' \n' | grep -o ".\{0,80\}\(식당\|맛집\|백반\).\{0,80\}" | head -8
          done
          echo "== kakao keyword 백반기행"
          curl -sS -H "Authorization: KakaoAK ${{ secrets.KAKAO_REST_KEY }}" "https://dapi.kakao.com/v2/local/search/keyword.json?query=%EB%B0%B1%EB%B0%98%EA%B8%B0%ED%96%89&size=15" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['meta']);[print(x['place_name'],x['road_address_name'],x['category_name']) for x in d['documents']]"
