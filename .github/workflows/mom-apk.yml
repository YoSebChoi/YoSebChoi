# Builds the 예비맘 혜택 지도 Android app (mom-app/, a Capacitor shell around the live web app)
# and publishes it at a fixed address:
#   https://github.com/YoSebChoi/YoSebChoi/releases/download/mom-apk/mom-map.apk
# The app loads the live page, so web updates reach it without a new APK; rebuild only when
# mom-app/ changes.
# Signing: the same repository secret as 노포 지도, ANDROID_SIGNING = "<password> <base64 of the PKCS12 keystore>" (alias "nopo").
# Without it the APK is signed with a throwaway debug key and cannot install over an earlier one.
# The installed app updates itself from the release: mom-map.json holds the build number.
name: 예비맘 혜택 지도 APK

on:
  push:
    paths:
      - "mom-app/**"
      - ".github/workflows/mom-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mom-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Launcher icons from the web app's icons
        run: pip install pillow && python3 mom/build.py --offline && python3 mom-app/make_icons.py
      - name: Capacitor sync
        working-directory: mom-app
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android
      - name: Signing key
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
        run: |
          if [ -z "$ANDROID_SIGNING" ]; then
            echo "::warning::ANDROID_SIGNING is not set: signing with a debug key (updates will need a reinstall)"
            exit 0
          fi
          password="${ANDROID_SIGNING%% *}"
          echo "::add-mask::$password"
          echo "${ANDROID_SIGNING#* }" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/mom.p12"
          echo "MOM_KEYSTORE=$RUNNER_TEMP/mom.p12" >> "$GITHUB_ENV"
          echo "MOM_KEY_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Build
        working-directory: mom-app/android
        env:
          MOM_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/mom-map.apk"
          # the installed app compares its own build number with this to offer updates
          echo '{"versionCode": ${{ github.run_number }}}' > "$GITHUB_WORKSPACE/mom-map.json"
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs "$GITHUB_WORKSPACE/mom-map.apk" | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: mom-map-apk
          path: mom-map.apk
      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="예비맘 혜택 지도 Android 앱 (빌드 ${{ github.run_number }}). 폰에서 mom-map.apk를 받아 설치하세요."
          if gh release view mom-apk >/dev/null 2>&1; then
            gh release edit mom-apk --title "예비맘 혜택 지도 앱" --notes "$notes"
          else
            gh release create mom-apk --title "예비맘 혜택 지도 앱" --notes "$notes" --target "$GITHUB_SHA"
          fi
          # the APK first: an app that sees the new number must find the new APK
          gh release upload mom-apk mom-map.apk --clobber
          gh release upload mom-apk mom-map.json --clobber
