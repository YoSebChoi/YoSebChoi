# Temporary: downloads public local-government lists (임신부 배려 할인업소 등) that the
# build sandbox cannot reach, and saves them as text under sources_raw/ for review.
name: 예비맘 공식 목록 받기 (임시)

on:
  push:
    branches-ignore: [main]
    paths:
      - "sources_raw/urls.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Fetch
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          mkdir -p sources_raw/out
          while read -r name url; do
            [ -z "$name" ] && continue
            f="$RUNNER_TEMP/$name"
            code=$(curl -sSL -m 60 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o "$f" -w '%{http_code}' "$url" || echo ERR)
            type=$(file -b --mime-type "$f" 2>/dev/null || echo none)
            echo "$name $code $type $url" >> sources_raw/out/_log.txt
            case "$type" in
              application/pdf) pdftotext -layout "$f" "sources_raw/out/$name.txt" ;;
              text/html|application/xhtml+xml) python3 - "$f" "sources_raw/out/$name" <<'PY'
          import sys, re, html
          raw = open(sys.argv[1], 'rb').read()
          m = re.search(rb'charset=["\']?([\w-]+)', raw[:4000])
          t = raw.decode((m.group(1).decode() if m else 'utf-8'), 'replace')
          links = re.findall(r'<a[^>]+href="([^"#]+)"[^>]*>(.*?)</a>', t, re.S)
          with open(sys.argv[2] + '.links.txt', 'w') as fh:
              for h, x in links:
                  x = re.sub(r'<[^>]+>|\s+', ' ', x).strip()
                  if x: fh.write(f"{h}\t{x}\n")
          t = re.sub(r'(?s)<script.*?</script>|<style.*?</style>', ' ', t)
          t = re.sub(r'</(tr|p|div|li|h\d)>|<br\s*/?>', '\n', t)
          t = re.sub(r'</t[dh]>', ' | ', t)
          t = html.unescape(re.sub(r'<[^>]+>', ' ', t))
          t = re.sub(r'[ \t]+', ' ', t); t = re.sub(r'\n\s*\n+', '\n', t)
          open(sys.argv[2] + '.txt', 'w').write(t)
          PY
              ;;
              *) head -c 20000 "$f" > "sources_raw/out/$name.raw" 2>/dev/null || true ;;
            esac
          done < sources_raw/urls.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources_raw/out
          git commit -m "sources: fetch official lists (temporary)" || exit 0
          git push
