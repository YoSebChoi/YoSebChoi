# Builds the 노포 지도 Android app (android-app/, a Capacitor shell around the live web app)
# and publishes it at a fixed address:
#   https://github.com/YoSebChoi/YoSebChoi/releases/download/nopo-apk/nopo-map.apk
# The app loads the live page, so web updates reach it without a new APK; rebuild only when
# android-app/ changes.
# Signing: a repository secret ANDROID_SIGNING = "<password> <base64 of the PKCS12 keystore>" (alias "nopo").
# Without it the APK is signed with a throwaway debug key and cannot install over an earlier one.
name: 노포 지도 APK

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/matjip-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matjip-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Launcher icons from the web app's icons
        run: pip install pillow && python3 android-app/make_icons.py
      - name: Capacitor sync
        working-directory: android-app
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android
      - name: Signing key
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
        run: |
          if [ -z "$ANDROID_SIGNING" ]; then
            echo "::warning::ANDROID_SIGNING is not set: signing with a debug key (updates will need a reinstall)"
            exit 0
          fi
          password="${ANDROID_SIGNING%% *}"
          echo "::add-mask::$password"
          echo "${ANDROID_SIGNING#* }" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/nopo.p12"
          echo "NOPO_KEYSTORE=$RUNNER_TEMP/nopo.p12" >> "$GITHUB_ENV"
          echo "NOPO_KEY_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Build
        working-directory: android-app/android
        env:
          NOPO_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/nopo-map.apk"
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs "$GITHUB_WORKSPACE/nopo-map.apk" | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: nopo-map-apk
          path: nopo-map.apk
      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="노포 지도 Android 앱 (빌드 ${{ github.run_number }}). 폰에서 nopo-map.apk를 받아 설치하세요."
          if gh release view nopo-apk >/dev/null 2>&1; then
            gh release edit nopo-apk --title "노포 지도 앱" --notes "$notes"
          else
            gh release create nopo-apk --title "노포 지도 앱" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload nopo-apk nopo-map.apk --clobber
