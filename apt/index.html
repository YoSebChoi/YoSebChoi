<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 단지 거래 추적</title>
<meta name="description" content="시범한빛마을 KCC스위첸과 이웃 단지의 네이버 부동산 매물이 사라지는 것으로 거래를 추정하고, 국토교통부 실거래로 확인해요">
<meta name="theme-color" content="#f4f6f8" id="themeColor">
<script>
// 화면 밝기 (설정): light by default, also on a phone in dark mode; "dark", or "auto" to follow the phone
(() => {
  let t = "light";
  try { t = JSON.parse(localStorage.getItem("aw-theme")) || "light"; } catch (e) {}
  const dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  if (t !== "auto") document.documentElement.dataset.theme = t;
  document.getElementById("themeColor").content = dark ? "#111418" : "#f4f6f8";
})();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root {
  --bg: #f4f6f8; --surface: #ffffff; --surface-2: #eef1f5; --ink: #18202a; --muted: #5f6b7a; --rule: #dde3ea;
  --accent: #2f5d8a; --accent-ink: #ffffff; --accent-soft: #e3edf7;
  --up: #d1453b; --down: #2a6fdb; --ok: #1f8a5b; --ok-soft: #e1f3ea; --warn: #b7791f; --warn-soft: #fbf0dc; --gray-soft: #eceff3;
  --font: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --surface: #1a1f26; --surface-2: #232a33; --ink: #e8ecf1; --muted: #9aa5b3; --rule: #2e3742;
    --accent: #7fb0e0; --accent-ink: #0d1520; --accent-soft: #1d2d40;
    --up: #f07a70; --down: #7aa8f5; --ok: #5cc794; --ok-soft: #173326; --warn: #e2b05a; --warn-soft: #3a2e17; --gray-soft: #262d36;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --surface: #1a1f26; --surface-2: #232a33; --ink: #e8ecf1; --muted: #9aa5b3; --rule: #2e3742;
  --accent: #7fb0e0; --accent-ink: #0d1520; --accent-soft: #1d2d40;
  --up: #f07a70; --down: #7aa8f5; --ok: #5cc794; --ok-soft: #173326; --warn: #e2b05a; --warn-soft: #3a2e17; --gray-soft: #262d36;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); -webkit-tap-highlight-color: transparent;
  padding-bottom: calc(68px + env(safe-area-inset-bottom)); }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-top: env(safe-area-inset-top); border-bottom: 1px solid var(--rule); }
header .wrap { display: flex; align-items: center; gap: 8px; min-height: 58px; }
header h1 { font-size: 18px; margin: 0; letter-spacing: -0.02em; line-height: 1.25; }
header .sub { font-size: 12px; color: var(--muted); }
header .grow { flex: 1; min-width: 0; }
.icon-btn { width: 40px; height: 40px; border: 0; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom); }
nav.tabs .wrap { display: flex; padding: 0 4px; }
.tab { flex: 1; border: 0; background: none; padding: 9px 0 10px; font-size: 12px; color: var(--muted); display: grid; justify-items: center; gap: 2px; cursor: pointer; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--accent); font-weight: 700; }
main { padding: 14px 0 24px; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
.card h2 { font-size: 15px; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
.card h2 .more { margin-left: auto; font-size: 13px; font-weight: 500; color: var(--accent); background: none; border: 0; cursor: pointer; padding: 4px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font-size: 18px; white-space: nowrap; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.row { display: flex; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--rule); }
.row:first-child { border-top: 0; }
.row.tap { cursor: pointer; }
.row .main { flex: 1; min-width: 0; }
.row .price { font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.row .meta { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.row .side { text-align: right; flex: none; font-size: 13px; }
.badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; vertical-align: 1px; white-space: nowrap; }
.b-guess { background: var(--warn-soft); color: var(--warn); }
.b-ok { background: var(--ok-soft); color: var(--ok); }
.b-back { background: var(--gray-soft); color: var(--muted); }
.b-new { background: var(--accent-soft); color: var(--accent); }
.down { color: var(--down); } .up { color: var(--up); }
.strike { text-decoration: line-through; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 22px 8px; font-size: 14px; }
.note { background: var(--accent-soft); border-radius: 14px; padding: 12px 14px; font-size: 13.5px; margin-bottom: 12px; }
.note b { color: var(--accent); }
.note.warn { background: var(--warn-soft); }
.note.warn b { color: var(--warn); }
.btn { border: 0; border-radius: 12px; padding: 10px 14px; background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn[disabled] { opacity: .55; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { fill: var(--muted); font-size: 10px; font-family: var(--font); }
svg.chart .grid { stroke: var(--rule); stroke-width: 1; }
svg.chart .dot { fill: var(--accent); fill-opacity: .8; }
svg.chart .dot.hit { fill: var(--ok); }
svg.chart .dot.cancel { fill: none; stroke: var(--muted); }
svg.chart .ask { fill: var(--warn); }
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: 0; }
dialog { border: 0; padding: 0; background: var(--surface); color: var(--ink); width: min(640px, 100%); max-width: 100%; max-height: 88vh;
  margin: auto auto 0; border-radius: 20px 20px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.18); }
dialog::backdrop { background: rgba(10, 16, 24, .45); }
dialog .head { display: flex; align-items: center; gap: 8px; padding: 14px 16px 6px; position: sticky; top: 0; background: var(--surface); z-index: 1; }
dialog .head h3 { margin: 0; font-size: 17px; flex: 1; }
dialog .body { padding: 4px 16px calc(20px + env(safe-area-inset-bottom)); }
dialog.center { margin: auto; border-radius: 18px; width: min(420px, calc(100% - 32px)); }
label.field { display: block; margin: 10px 0; font-size: 13px; color: var(--muted); }
label.field input, label.field select { display: block; width: 100%; margin-top: 4px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 10px; background: var(--bg); font-size: 15px; }
.switch { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
.switch input { width: 20px; height: 20px; accent-color: var(--accent); }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom)); background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.2); }
.spark { width: 100%; height: 46px; display: block; }
.spark path { fill: none; stroke: var(--accent); stroke-width: 2; }
.spark .area { fill: var(--accent-soft); stroke: none; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.list-plain { margin: 6px 0 0; padding-left: 18px; font-size: 13.5px; }
.list-plain li { margin: 3px 0; }
</style>
</head>

<script src="tracker.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const lget = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
  const lset = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const T = window.Tracker, DAY = T.DAY;

  // inside the Android app (apt-app/, Capacitor) the injected native bridge adds AptNet: Naver 부동산 read from
  // the phone, a background check twice a day, and the files it leaves for this page. The page does not
  // bundle @capacitor/core, so plugins are called through the bridge itself.
  const Cap = window.Capacitor;
  const native = !!(Cap && Cap.isNativePlatform && Cap.isNativePlatform());
  const ncall = (p, m, o = {}) => Cap.Plugins?.[p]?.[m] ? Cap.Plugins[p][m](o) : Cap.nativePromise(p, m, o);
  const nlisten = (p, ev, cb) => Cap.Plugins?.[p]?.addListener ? Cap.Plugins[p].addListener(ev, cb) : Cap.nativeCallback(p, "addListener", { eventName: ev }, cb);

  let toastTimer = null;
  function toast(text) {
    const t = $("#toast"); t.textContent = text; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3400);
  }

  /* ===================== state ===================== */
  // the listing history lives only on this phone (aw-state); aw-cfg holds which Naver complexes are ours
  let S = lget("aw-state", null) || T.emptyState();
  let cfg = Object.assign({ links: {}, hours: 12, notify: true, scheduled: "", daily: true, dailyAt: "09:00" }, lget("aw-cfg", {}));
  let DATA = { complexes: [], trades: [], blog: [], otherNames: [] };
  const saveState = () => { if (!lset("aw-state", S)) toast("저장 공간이 부족해요. 설정에서 기록을 내보내 두세요."); };
  const saveCfg = () => lset("aw-cfg", cfg);

  const mainCx = () => DATA.complexes.find(c => c.main) || DATA.complexes[0];
  const byKey = k => DATA.complexes.find(c => c.key === k);
  const linked = () => DATA.complexes.filter(c => cfg.links[c.key]?.no);
  const keyOfNo = no => Object.keys(cfg.links).find(k => String(cfg.links[k].no) === String(no));
  const shortName = c => c ? c.name.replace(/^시범한빛마을\s*/, "") : "";
  const nameOfNo = no => shortName(byKey(keyOfNo(no))) || cfg.links[keyOfNo(no)]?.name || no;

  const fmt = T.formatPrice;
  const dshort = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}`; };
  const dfull = t => { const d = new Date(t); return `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}`; };
  const ago = t => {
    const m = Math.round((Date.now() - t) / 60000);
    if (m < 1) return "방금"; if (m < 60) return `${m}분 전`;
    const h = Math.round(m / 60); if (h < 24) return `${h}시간 전`;
    return `${Math.round(h / 24)}일 전`;
  };
  const days = (a, b) => Math.max(0, Math.round((b - a) / DAY));
  // 평 as people say it (공급면적 기준: 84㎡ 전용 = 32평); without 공급면적 only the 전용 ㎡
  const sizeLabel = (area, supply) => supply ? `${Math.round(supply / 3.3058)}평` : area ? `${Math.round(area)}㎡` : "";
  // display only (the stored values make the flat's key): "212" → "212동", "ES" → "남동향"
  const dongLabel = d => !d ? "동 미공개" : /^\d+$/.test(d) ? `${d}동` : d;
  const DIRS = { EE: "동향", WW: "서향", SS: "남향", NN: "북향", ES: "남동향", SE: "남동향", WS: "남서향", SW: "남서향", EN: "북동향", NE: "북동향", WN: "북서향", NW: "북서향" };
  const dirLabel = d => DIRS[String(d || "").toUpperCase()] || d || "";
  const unitLabel = u => `${dongLabel(u.dong)} ${u.floor}층${u.floorTotal ? `/${u.floorTotal}` : ""}`;
  const areaLabel = (a, supply) => a ? `전용 ${a.toFixed(1)}㎡${supply ? ` · ${sizeLabel(a, supply)}` : ""}` : "";
  const STATUS = { "거래 추정": "b-guess", "실거래 확인": "b-ok", "재등록": "b-back" };

  /* ===================== Naver 부동산 (phone only) ===================== */
  const LIST_URL = no => `https://m.land.naver.com/complex/getComplexArticleList?hscpNo=${encodeURIComponent(no)}&tradTpCd=A1&order=date_&showR0=N&page={page}`;
  const NAVER_ARTICLE = no => `https://fin.land.naver.com/articles/${encodeURIComponent(no)}`;
  const NAVER_COMPLEX = no => `https://fin.land.naver.com/complexes/${encodeURIComponent(no)}`;

  // the last answers from Naver, kept on this phone for 설정 → 네트워크 진단 (what to send when something breaks)
  let netlog = lget("aw-netlog", []);
  function logNet(url, r, err) {
    const u = new URL(url);
    netlog.push({ t: Date.now(), path: u.host + u.pathname, status: r ? r.status : null, location: r && r.location || "",
      head: r ? String(r.body || "").replace(/\s+/g, " ").slice(0, u.host.startsWith("fin.") ? 500 : 200) : "", err: err || "" });
    netlog = netlog.slice(-12);
    lset("aw-netlog", netlog);
  }
  // opts {method, body}: a POST with a JSON body (needs an app with AptNet.request)
  async function netJson(url, opts) {
    let r;
    const send = () => opts ? ncall("AptNet", "request", { url, ...opts }) : ncall("AptNet", "get", { url });
    try { r = await send(); }
    catch (e) {
      // a dropped connection (switching between Wi-Fi and LTE, a weak signal): one more try 2 seconds later
      logNet(url, null, e.message);
      await sleep(2000);
      try { r = await send(); }
      catch (e2) {
        logNet(url, null, e2.message);
        const offline = /resolve host|No address|timeout|timed out|Unable to|connect|reset/i.test(e2.message);
        throw new Error(offline ? "인터넷 연결이 잠깐 끊겼어요. 잠시 뒤 다시 확인해요" : `인터넷 연결 문제예요 (${e2.message})`);
      }
    }
    logNet(url, r);
    if (r.status !== 200) throw new Error(r.status >= 300 && r.status < 400 ? `네이버가 요청을 막았어요 (HTTP ${r.status}). 잠시 뒤 다시 해 보세요` : `HTTP ${r.status}`);
    try { return JSON.parse(r.body); } catch (e) { throw new Error("네이버 답이 예상한 형식이 아니에요"); }
  }

  // what an unexpected answer looked like, for the error message: its keys, or its start
  const shapeOf = j => j && typeof j === "object"
    ? "{" + Object.entries(j).slice(0, 6).map(([k, v]) => k + (Array.isArray(v) ? `[${v.length}]` : v && typeof v === "object" ? "{" + Object.keys(v).slice(0, 5).join(",") + "}" : "=" + String(v).slice(0, 20))).join(", ") + "}"
    : String(j).slice(0, 80);

  // the complex's own 매매 list (m.land 단지 매물)
  async function fetchComplexList(no, maxPages = 10) {
    const all = [];
    for (let page = 1; page <= maxPages; page++) {
      if (page > 1) await sleep(1200 + Math.random() * 1200);
      const j = await netJson(LIST_URL(no).replace("{page}", page));
      const res = j && j.result;
      // an empty list can come as list: null, or with no result at all on the last page
      if (res && (res.list == null) && page > 1) break;
      if (res && res.list == null && (res.totAtclCnt === 0 || res.moreDataYn === "N")) break;
      if (!res || !Array.isArray(res.list)) throw new Error(`단지 매물 목록 형식이 달라요: ${shapeOf(j)}`);
      all.push(...res.list);
      if (res.moreDataYn !== "Y") break;
    }
    return all;
  }

  // the map's article list in a small box around the complex, keeping this complex's articles only
  // (used when the complex list comes back empty: Naver has answered an empty list there while the map shows listings)
  const MAP_URL = (lat, lng, d = 0) => {
    const dy = Math.max(0.0018, d), dx = Math.max(0.0022, d);
    return `https://m.land.naver.com/cluster/ajax/articleList?rletTpCd=APT&tradTpCd=A1&z=${d > 0.004 ? 16 : 17}&lat=${lat}&lon=${lng}` +
      `&btm=${(lat - dy).toFixed(6)}&lft=${(lng - dx).toFixed(6)}&top=${(lat + dy).toFixed(6)}&rgt=${(lng + dx).toFixed(6)}&page={page}`;
  };
  const squash = s => String(s || "").replace(/\s+/g, "").toLowerCase();
  async function fetchMapList(link, maxPages = link.approx > 0.004 ? 12 : 6) {
    const all = [];
    for (let page = 1; page <= maxPages; page++) {
      await sleep(1200 + Math.random() * 1200);
      const j = await netJson(MAP_URL(link.lat, link.lng, link.approx || 0).replace("{page}", page));
      const list = Array.isArray(j.body) ? j.body : Array.isArray(j.result?.list) ? j.result.list : null;
      if (!list) throw new Error(`지도 매물 목록 형식이 달라요: ${shapeOf(j)}`);
      all.push(...list);
      if (list.length < 20 && j.more !== true) break;
    }
    return mineOnly(link, all);
  }
  const mineOnly = (link, list) => list.filter(a => String(a.hscpNo || "") === String(link.no) || (link.name && squash(a.atclNm) === squash(link.name)));
  // where this complex's listings were last found: "지도" when the complex list came back empty
  // kept on the link (a background snapshot has no source of its own, and must not send the complex back to the old list)
  const srcOf = no => cfg.links[keyOfNo(no)]?.src || ([...S.snaps].reverse().find(s => s.cx === String(no) && s.ok && s.src) || {}).src || "단지";

  let lastDiscover = 0;
  // → {articles, src}: the complex list, or the map list when the first is empty
  // a page the site itself opens first, for the cookies it would have (once per refresh per site)
  const warmed = {};
  async function warm(site, url) {
    if (warmed[site] && Date.now() - warmed[site] < 10 * 60e3) return;
    warmed[site] = Date.now();
    try { await ncall("AptNet", "get", { url }); await sleep(600 + Math.random() * 600); } catch (e) { /* the list will say what is wrong */ }
  }

  async function fetchListings(no, maxPages = 10) {
    let list = [], complexErr = null, finErr = null;
    await warm("m", `https://m.land.naver.com/complex/info/${encodeURIComponent(no)}?tradTpCd=A1`);
    try { list = await fetchComplexList(no, maxPages); } catch (e) { complexErr = e; }
    if (list.length || (maxPages === 1 && !complexErr)) return { articles: list, src: "단지" };
    if (maxPages === 1) throw complexErr;
    // the new site (fin.land.naver.com), which the mobile site's lists are giving way to
    try {
      const fin = await fetchFinList(no);
      if (fin.length) return { articles: fin, src: "fin" };
    } catch (e) { finErr = e; }
    const key = keyOfNo(no);
    let link = key && cfg.links[key];
    // coordinates come from the complex search, once per refresh for all complexes
    if (link && (!(link.lat && link.lng) || link.approx > 0.004) && Date.now() - lastDiscover > 10 * 60e3) {
      lastDiscover = Date.now();
      try { await sleep(1000); found = await discover(); autoLink(found); link = cfg.links[key]; } catch (e) { /* no coordinates: keep the empty answer */ }
    }
    const errs = [complexErr, finErr].filter(Boolean).map(e => e.message);
    if (!link || !(link.lat && link.lng)) {
      if (errs.length) throw new Error(`${errs.join(" / ")} (지도 목록은 단지 좌표가 없어 못 읽었어요: 설정 → 주변 단지 찾기)`);
      return { articles: list, src: "단지" };
    }
    try {
      const m = await fetchMapList(link);
      if (!m.length && errs.length) throw new Error("지도 목록도 비었어요");
      return { articles: m, src: "지도" };
    }
    catch (e) { throw new Error([...errs, e.message].join(" / ")); }
  }

  /* --- the new site: fin.land.naver.com (네이버페이 부동산) ---
     The list is a POST with the complex number; each item is one flat with the agents' copies grouped.
     FIN_MAP says where each field we use sits, with fallbacks ("a.b|c"): the background check (SnapshotWorker)
     gets the same map, so a change here reaches it without a new app. */
  const FIN_LIST = "https://fin.land.naver.com/front-api/v1/complex/article/list";
  const FIN_BODY = no => ({ complexNumber: String(no), tradeTypes: ["A1"], pyeongTypes: [], dongNumbers: [], userChannelType: "MOBILE",
    articleSortType: "RANKING_DESC", seed: "", lastInfo: [], size: 30 });
  const R = "representativeArticleInfo.";
  const FIN_MAP = {
    atclNo: `${R}articleNumber|articleNumber|articleNo`,
    atclNm: `${R}complexName|complexName`,
    bildNm: `${R}dongName|dongName|buildingName`,
    flrInfo: `${R}articleDetail.floorInfo|articleDetail.floorInfo|floorInfo|${R}floorInfo`,
    spc1: `${R}spaceInfo.supplySpace|spaceInfo.supplySpace|supplySpace`,
    spc2: `${R}spaceInfo.exclusiveSpace|spaceInfo.exclusiveSpace|exclusiveSpace`,
    prc: `${R}priceInfo.dealPrice|priceInfo.dealPrice|dealPrice|${R}priceInfo.price`,
    direction: `${R}articleDetail.direction|articleDetail.direction|direction`,
    rltrNm: `${R}brokerInfo.brokerageName|brokerInfo.brokerageName|brokerageName`,
    atclFetrDesc: `${R}articleDetail.articleFeatureDescription|articleDetail.articleFeatureDescription|articleFeatureDescription`,
    atclCfmYmd: `${R}verificationInfo.exposureStartDate|verificationInfo.exposureStartDate|exposureStartDate`,
  };
  const FIN_PATHS = { listPath: "result.list|result.articleList|list", nextPath: "result.hasNextPage|hasNextPage", cursorPath: "result.lastInfo|lastInfo", cursorKey: "lastInfo" };
  // the same dotted paths as SnapshotWorker.path
  const jpath = (o, spec) => {
    for (const p of String(spec || "").split("|")) {
      let v = o;
      for (const k of p.split(".")) { v = v == null ? undefined : v[k]; if (v === null) v = undefined; }
      if (v !== undefined) return v;
    }
    return undefined;
  };
  let finPriceDiv = 1;   // 원 → 만원 when the prices come in 원
  function finToArticle(item) {
    const a = { tradTpCd: "A1" };
    for (const [k, p] of Object.entries(FIN_MAP)) { const v = jpath(item, p); if (v !== undefined && typeof v !== "object") a[k] = v; }
    if (typeof a.prc === "number" && a.prc > 1e6) { finPriceDiv = 10000; a.prc = Math.round(a.prc / 10000); }
    if (typeof a.prc === "number") a.hanPrc = fmt(a.prc);
    return a;
  }
  async function fetchFinList(no, maxPages = 8) {
    if (!(Cap.Plugins?.AptNet?.request)) throw new Error("새 네이버 목록은 앱 업데이트가 필요해요");
    await warm("fin", `https://fin.land.naver.com/complexes/${encodeURIComponent(no)}?tab=article`);
    const body = FIN_BODY(no), out = [];
    for (let page = 1; page <= maxPages; page++) {
      if (page > 1) await sleep(1200 + Math.random() * 1200);
      const j = await netJson(FIN_LIST, { method: "POST", body });
      const list = jpath(j, FIN_PATHS.listPath);
      if (!Array.isArray(list)) throw new Error(`새 네이버 목록 형식이 달라요: ${shapeOf(j)}`);
      for (const item of list) {
        const a = finToArticle(item);
        if (a.atclNo) out.push(a);
        // the other agents' copies of the same flat count as more agents
        const dups = jpath(item, "duplicatedArticleInfo.articleInfoList|duplicatedArticleInfoList");
        if (Array.isArray(dups)) for (const d of dups) { const b = finToArticle(d); if (b.atclNo && b.atclNo !== a.atclNo) out.push({ ...a, ...b, bildNm: a.bildNm, flrInfo: a.flrInfo, spc2: a.spc2, direction: a.direction }); }
      }
      const cursor = jpath(j, FIN_PATHS.cursorPath);
      if (!jpath(j, FIN_PATHS.nextPath) || cursor == null) break;
      body.lastInfo = cursor;
    }
    return out;
  }

  // complexes around 시범한빛마을, from the mobile map
  async function discoverBox(c, d) {
    const url = `https://m.land.naver.com/cluster/ajax/complexList?view=atcl&rletTpCd=APT&tradTpCd=A1&z=16&lat=${c.lat}&lon=${c.lng}` +
      `&btm=${(c.lat - d).toFixed(6)}&lft=${(c.lng - d).toFixed(6)}&top=${(c.lat + d).toFixed(6)}&rgt=${(c.lng + d).toFixed(6)}`;
    const j = await netJson(url);
    const list = Array.isArray(j.result) ? j.result : (j.result?.list || j.list || []);
    // 네트워크 진단: the field names of a complex, so a renamed coordinate shows
    if (list[0] && netlog.length) { netlog[netlog.length - 1].head = "칸: " + Object.keys(list[0]).join(",").slice(0, 300); lset("aw-netlog", netlog); }
    const num = (...vs) => { for (const v of vs) { const n = parseFloat(v); if (isFinite(n) && n) return n; } return null; };
    return list.map(x => {
      const lat = num(x.lat, x.latitude, x.y, x.mapYCrdn, x.ycrdn), lng = num(x.lng, x.lon, x.longitude, x.x, x.mapXCrdn, x.xcrdn);
      // no coordinates in the answer: where it was found (the box), with how far off it can be
      return { no: String(x.hscpNo || x.complexNo), name: x.hscpNm || x.complexName || "", hh: x.totHsehCnt || x.totalHouseholdCount || null,
        lat: lat || c.lat, lng: lng || c.lng, approx: lat && lng ? 0 : d, deals: x.dealCnt ?? null };
    }).filter(x => x.no && x.name);
  }

  // complexes around 시범한빛마을, from the mobile map. Naver answers at most 20 per box, so when the
  // first wide look is full and one of ours is missing, look again in small boxes around the 한빛마을 ones found
  const ours = (c, f) => new RegExp(c.naverName, "i").test(f.name) && /한빛/.test(f.name);
  async function discover() {
    const center = DATA.center || { lat: 37.2045, lng: 127.0725 };
    const all = new Map();
    // keep each complex's most exact position (exact coordinates, or the smallest box it was found in)
    const add = list => list.forEach(f => { const o = all.get(f.no); if (!o || f.approx < o.approx) all.set(f.no, f); });
    const precise = f => f && f.approx <= 0.004;
    const first = await discoverBox(center, 0.012);
    add(first);
    // ours not found yet: unlinked and no match, or linked without coordinates and its number not seen
    const missing = () => DATA.complexes.some(c => {
      const l = cfg.links[c.key];
      if (l?.no) return !precise(all.get(String(l.no))) && !(l.lat && l.lng && !(l.approx > 0.004));
      return ![...all.values()].some(f => ours(c, f) && precise(f));
    });
    if (first.length >= 20 && missing()) {
      const hb = [...all.values()].filter(f => /한빛/.test(f.name) && f.lat && f.lng && precise(f));
      const mid = hb.length ? { lat: hb.reduce((a, f) => a + f.lat, 0) / hb.length, lng: hb.reduce((a, f) => a + f.lng, 0) / hb.length } : center;
      for (const dy of [0, -0.005, 0.005]) for (const dx of [0, -0.005, 0.005]) {
        if (!missing()) break;
        await sleep(1200 + Math.random() * 1000);
        add(await discoverBox({ lat: mid.lat + dy, lng: mid.lng + dx }, 0.003));
      }
    }
    // 한빛마을 first in the list
    return [...all.values()].sort((a, b) => (/한빛/.test(b.name) ? 1 : 0) - (/한빛/.test(a.name) ? 1 : 0));
  }

  function autoLink(found) {
    let n = 0;
    for (const c of DATA.complexes) {
      const l = cfg.links[c.key];
      if (l?.no) {
        const f = found.find(f => f.no === String(l.no));
        if (f && (!(l.lat && l.lng) || (l.approx || 0) >= f.approx)) Object.assign(l, { lat: f.lat, lng: f.lng, approx: f.approx });
        if (f) Object.assign(l, { deals: f.deals, hh: l.hh || f.hh, name: l.name || f.name });
        continue;
      }
      const hit = found.find(f => ours(c, f));
      if (hit) { cfg.links[c.key] = { no: hit.no, name: hit.name, hh: hit.hh, lat: hit.lat, lng: hit.lng, approx: hit.approx, deals: hit.deals }; n++; }
    }
    saveCfg();
    return n;
  }

  // finds the complexes and links ours; says why when nothing could be linked
  async function discoverAndLink() {
    found = await discover();
    if (!found.length) throw new Error("주변 단지를 하나도 받지 못했어요 (네이버 답의 형식이 바뀐 것 같아요)");
    const n = autoLink(found);
    if (!n && !linked().length) throw new Error(`주변 단지 ${found.length}곳을 받았지만 한빛마을 이름이 없어요: ${found.slice(0, 5).map(f => f.name).join(", ")}`);
    return n;
  }

  const parseNaverLink = s => {
    const m = String(s || "").match(/complexes\/(\d+)|complex\/info\/(\d+)|hscpNo=(\d+)|complexNo=(\d+)|^\s*(\d{3,})\s*$/);
    return m ? (m[1] || m[2] || m[3] || m[4] || m[5]) : null;
  };

  // the background check's saved snapshots, then a fresh look at each complex not checked in the last 30 minutes
  let busy = false;
  async function refresh(force = false) {
    if (!native || busy) return;
    busy = true; $("#refreshBtn").classList.add("spin");
    let changes = { added: 0, gone: 0, back: 0, priced: 0 };
    const tally = r => { for (const k in changes) changes[k] += r[k] || 0; };
    try {
      try {
        const got = await ncall("AptNet", "collect");
        for (const s of (got && got.snapshots) || []) {
          if (!keyOfNo(s.cx)) continue;
          if (!s.ok) { T.recordFailure(S, s.cx, s.t, s.err); continue; }
          let arts = s.articles || [];
          // listings found on the map: keep this complex's own, and do not take an empty complex list
          // (from an older background check) as a sell-out
          const src = srcOf(s.cx);
          if (src !== "단지") {
            if (src === "지도") arts = mineOnly(cfg.links[keyOfNo(s.cx)], arts);
            if (!arts.length) continue;
          }
          tally(T.ingest(S, s.cx, s.t, arts));
        }
      } catch (e) { /* an older app without the background check */ }
      // nothing linked yet, or 우리 단지 still missing (at most every 6 hours)
      const lastFind = [...S.snaps].reverse().find(s => s.cx === "discover");
      const m = mainCx();
      if (!linked().length || (m && !cfg.links[m.key]?.no && (!lastFind || Date.now() - lastFind.t > 6 * 3600e3))) {
        setStatus("네이버 부동산 단지를 찾는 중…");
        try { const n = await discoverAndLink(); S.snaps.push({ t: Date.now(), cx: "discover", ok: true, count: found.length, units: n }); }
        catch (e) { T.recordFailure(S, "discover", Date.now(), e.message); }
      }
      const cxs = linked();
      for (let i = 0; i < cxs.length; i++) {
        const no = String(cfg.links[cxs[i].key].no);
        const last = [...S.snaps].reverse().find(s => s.cx === no && s.ok);
        if (!force && last && Date.now() - last.t < 30 * 60e3) continue;
        setStatus(`${shortName(cxs[i])} 매물 확인 중… (${i + 1}/${cxs.length})`);
        try {
          if (i) await sleep(1500 + Math.random() * 1000);
          const got = await fetchListings(no);
          tally(T.ingest(S, no, Date.now(), got.articles));
          const snap = S.snaps[S.snaps.length - 1];
          if (snap && snap.cx === no && snap.ok) snap.src = got.src;
          if (cfg.links[keyOfNo(no)] && got.articles.length) { cfg.links[keyOfNo(no)].src = got.src; saveCfg(); }
        } catch (e) { T.recordFailure(S, no, Date.now(), e.message); }
      }
      matchTrades();
      saveState();
      scheduleBackground();
      const parts = [];
      if (changes.gone) parts.push(`사라진 집 ${changes.gone}`);
      if (changes.added) parts.push(`새 매물 ${changes.added}`);
      if (changes.priced) parts.push(`가격 변경 ${changes.priced}`);
      if (changes.back) parts.push(`다시 올라옴 ${changes.back}`);
      if (parts.length) toast(parts.join(" · "));
      const fails = cxs.map(c => [...S.snaps].reverse().find(s => s.cx === String(cfg.links[c.key].no))).filter(s => s && !s.ok);
      if (fails.length) toast(`확인하지 못한 단지가 있어요: ${fails[0].err}`);
    } finally {
      busy = false; $("#refreshBtn").classList.remove("spin");
      renderAll();
    }
  }

  // the background check reads the same pages (SnapshotWorker); set again only when something changed
  let dailyState = null;   // {next, exact, battery} from the last AptNet.daily
  async function scheduleBackground() {
    if (!native) return;
    const jobs = linked().map(c => {
      const l = cfg.links[c.key], no = String(l.no);
      const src = srcOf(no);
      if (src === "fin") return { cx: no, name: shortName(c), url: FIN_LIST, method: "POST", body: FIN_BODY(no), maxPages: 8,
        seed: `https://fin.land.naver.com/complexes/${no}?tab=article`, map: FIN_MAP, priceDiv: 10000, ...FIN_PATHS };
      return src === "지도" && l.lat && l.lng
        ? { cx: no, name: shortName(c), url: MAP_URL(l.lat, l.lng, l.approx || 0), maxPages: l.approx > 0.004 ? 12 : 6, hscpNo: no, only: squash(l.name) }
        : { cx: no, name: shortName(c), url: LIST_URL(no), maxPages: 10, seed: `https://m.land.naver.com/complex/info/${no}?tradTpCd=A1` };
    });
    const sig = JSON.stringify([jobs, cfg.hours, cfg.notify]);
    // Android 13+ asks once before an app may notify
    if (cfg.notify && cfg.hours && jobs.length && !cfg.askedNotify) {
      cfg.askedNotify = true; saveCfg();
      try { await ncall("LocalNotifications", "requestPermissions"); } catch (e) {}
    }
    // the morning summary: each run books the next day itself; booking it again on every opening (same time,
    // replaced) keeps the chain going even if a run was killed
    {
      const [hour, minute] = cfg.dailyAt.split(":").map(Number);
      try { dailyState = await ncall("AptNet", "daily", { on: cfg.daily, hour, minute }); } catch (e) { /* older app */ }
    }
    if (sig === cfg.scheduled) return;
    try { await ncall("AptNet", "schedule", { jobs, hours: cfg.hours, notify: cfg.notify }); cfg.scheduled = sig; saveCfg(); } catch (e) { /* older app */ }
  }

  function tradesForMatching() {
    return DATA.trades.map(t => {
      const no = cfg.links[t.cx]?.no;
      if (!no) return null;
      const x = { date: t.date, cx: String(no), area: t.area, floor: t.floor, price: t.price, dong: t.aptDong, cancelled: t.cancelled };
      x.id = T.tradeId(x);
      return x;
    }).filter(Boolean);
  }
  const matchTrades = () => T.matchTrades(S, tradesForMatching());

  /* ===================== rendering ===================== */
  function setStatus(text) { $("#status").textContent = text; }
  function statusLine() {
    const m = mainCx();
    const tr = DATA.tradesUpdated ? `실거래 ${DATA.tradesUpdated} 기준` : "실거래 자료 없음";
    if (!native) return `${tr} · 블로그 ${DATA.blogUpdated || "-"}`;
    if (!linked().length) return "설정에서 네이버 부동산 단지를 연결해 주세요";
    const oks = S.snaps.filter(s => s.ok && s.cx !== "discover");
    const last = oks.length ? oks[oks.length - 1].t : null;
    return last ? `매물 확인 ${ago(last)} · ${tr}` : "아직 매물을 확인하지 않았어요";
  }

  let filterCx = null;   // complex shown on 매물 / 거래 추정 (Naver no)
  let tradeKey = null, tradeArea = "all", goneFilter = "all", newsKey = "all", newsDeal = true;

  function cxChips(sel, withAll = false) {
    const cs = linked();
    if (cs.length < 2 && !withAll) return "";
    const chips = (withAll ? [`<button class="chip" data-cx="" aria-pressed="${!sel}">전체</button>`] : [])
      .concat(cs.map(c => { const no = String(cfg.links[c.key].no); return `<button class="chip" data-cx="${esc(no)}" aria-pressed="${sel === no}">${esc(shortName(c))}</button>`; }));
    return `<div class="chips" data-chips>${chips.join("")}</div>`;
  }
  function bindChips(root, attr, fn) {
    root.querySelectorAll(`[data-${attr}]`).forEach(b => b.addEventListener("click", () => fn(b.dataset[attr])));
  }

  const unitsOf = no => Object.values(S.units).filter(u => !no || u.cx === no);
  const listingsOf = u => u.articles.map(n => S.listings[n]).filter(Boolean);

  function appNote() {
    return `<div class="note"><b>매물 추적은 Android 앱에서 돼요.</b> 네이버 부동산 매물은 내 폰이 직접 확인하고 기록도 폰에만 남겨요.
      웹에서는 실거래와 블로그 글을 볼 수 있어요.<br><a href="https://github.com/YoSebChoi/YoSebChoi/releases/download/apt-apk/apt-watch.apk">앱 받기 (apt-watch.apk)</a></div>`;
  }

  function sparkline(no) {
    const d = S.daily[no] || {};
    const keys = Object.keys(d).sort().slice(-60);
    if (keys.length < 2) return "";
    const vals = keys.map(k => d[k]), max = Math.max(...vals, 1), min = Math.min(...vals, 0);
    const W = 300, H = 46, x = i => (i / (keys.length - 1)) * W, y = v => H - 4 - ((v - min) / Math.max(1, max - min)) * (H - 10);
    const line = vals.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="매물 수 추이"><path class="area" d="${line}L${W},${H}L0,${H}Z"/><path d="${line}"/></svg>
      <div class="tiny muted" style="display:flex;justify-content:space-between"><span>${esc(keys[0].slice(5).replace("-", "/"))}</span><span>매물 수(집) ${min}~${max}</span><span>${esc(keys.at(-1).slice(5).replace("-", "/"))}</span></div>`;
  }

  function eventRow(e) {
    const u = e.unit.split("|"), label = `${nameOfNo(e.cx)} ${u[1] !== "?" ? dongLabel(u[1]) : ""} ${u[2]}층 ${u[3] !== "?" ? Math.round(+u[3]) + "㎡" : ""}`;
    const kinds = {
      gone: [`<span class="badge b-guess">사라짐</span>`, `${fmt(e.price)}에 있던 매물 · 거래됐을 수 있어요`],
      trade: [`<span class="badge b-ok">실거래</span>`, `${fmt(e.price)} 거래 신고 (${esc(e.date)})`],
      back: [`<span class="badge b-back">다시 올라옴</span>`, `${fmt(e.price)} · 거래가 아니었어요`],
      new: [`<span class="badge b-new">새 매물</span>`, fmt(e.price)],
      price: [`<span class="badge ${e.to < e.from ? "b-new" : "b-guess"}">${e.to < e.from ? "가격 내림" : "가격 올림"}</span>`, `${fmt(e.from)} → <b class="${e.to < e.from ? "down" : "up"}">${fmt(e.to)}</b>`],
    }[e.type];
    return `<div class="row tap" data-unit="${esc(e.unit)}"><div class="main"><div>${kinds[0]} <span class="small">${esc(label)}</span></div><div class="meta">${kinds[1]}</div></div><div class="side muted">${dshort(e.t)} ›</div></div>`;
  }

  function renderHome() {
    const el = $("#panel-home"), m = mainCx();
    let h = native ? "" : appNote();
    if (native && !linked().length) {
      const why = [...S.snaps].reverse().find(s => s.cx === "discover");
      h += `<div class="note warn"><b>네이버 부동산 단지를 아직 연결하지 않았어요.</b> 설정 → 단지 연결에서 「주변 단지 찾기」를 눌러 주세요.
        ${why && !why.ok ? `<br>마지막으로 찾아본 결과 (${ago(why.t)}): ${esc(why.err)}` : ""}</div>`;
    }
    const mainNo = m && cfg.links[m.key]?.no ? String(cfg.links[m.key].no) : null;
    if (native && mainNo) {
      const us = unitsOf(mainNo), ps = us.map(u => u.lastPrice).filter(Boolean);
      const since = Date.now() - 30 * DAY;
      const gone30 = S.gone.filter(g => g.cx === mainNo && g.lastSeen >= since && g.status !== "재등록");
      h += `<div class="card"><h2>${esc(shortName(m))} 지금 매물<button class="more" data-go="list">전체 보기</button></h2>
        <div class="stats">
          <div class="stat"><b>${us.length}</b><span>매물 (집 기준)</span></div>
          <div class="stat"><b>${ps.length ? fmt(Math.min(...ps)) : "-"}</b><span>최저 호가</span></div>
          <div class="stat"><b>${gone30.length}</b><span>30일 거래 추정</span></div>
        </div>
        <div style="margin-top:10px">${sparkline(mainNo)}</div></div>`;
    }
    if (native) {
      const evs = S.events.filter(e => e.type !== "new" || Date.now() - e.t < 7 * DAY).slice(-12).reverse();
      h += `<div class="card"><h2>최근 변화<button class="more" data-go="gone">거래 추정 보기</button></h2>
        ${evs.length ? evs.map(eventRow).join("") : `<div class="empty">아직 변화가 없어요. 매물이 사라지거나 가격이 바뀌면 여기에 보여요.</div>`}</div>`;
    }
    const recent = DATA.trades.filter(t => t.cx === (m && m.key)).slice(-5).reverse();
    h += `<div class="card"><h2>${esc(shortName(m) || "우리 단지")} 최근 실거래<button class="more" data-go="trades">더 보기</button></h2>
      ${recent.length ? recent.map(t => tradeRow(t, matchedTrades())).join("") : `<div class="empty">${DATA.tradeMonths && DATA.tradeMonths.length ? "최근 거래가 없어요" : "실거래 자료를 아직 받지 않았어요 (저장소 Secret MOLIT_KEY 필요)"}</div>`}</div>`;
    const posts = DATA.blog.filter(p => p.deal && p.cx.includes(m && m.key)).slice(0, 3);
    if (posts.length) h += `<div class="card"><h2>블로그에서<button class="more" data-go="news">더 보기</button></h2>${posts.map(postRow).join("")}</div>`;
    el.innerHTML = h;
    el.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => showTab(b.dataset.go)));
    el.querySelectorAll("[data-unit]").forEach(r => r.addEventListener("click", () => openUnit(r.dataset.unit)));
  }

  function renderList() {
    const el = $("#panel-list");
    if (!native) { el.innerHTML = appNote(); return; }
    const cs = linked();
    if (!cs.length) { el.innerHTML = `<div class="empty">설정에서 네이버 부동산 단지를 연결하면 매물이 보여요.</div>`; return; }
    if (!filterCx || !cs.some(c => String(cfg.links[c.key].no) === filterCx)) filterCx = String(cfg.links[(cs.find(c => c.main) || cs[0]).key].no);
    const us = unitsOf(filterCx).sort((a, b) => (a.lastPrice || 9e9) - (b.lastPrice || 9e9));
    const now = Date.now();
    const rows = us.map(u => {
      const ls = listingsOf(u), first = ls[0] || {};
      const cut = ls.flatMap(l => l.history.length > 1 ? [[l.history[0].price, l.history.at(-1).price]] : []).find(([a, b]) => a !== b);
      const tags = [...new Set(ls.flatMap(l => l.tags || []))].slice(0, 3);
      return `<div class="row tap" data-unit="${esc(u.key)}"><div class="main">
          <div class="price">${fmt(u.lastPrice)} ${cut ? `<span class="small ${cut[1] < cut[0] ? "down" : "up"}">${cut[1] < cut[0] ? "▼" : "▲"}${fmt(Math.abs(cut[0] - cut[1]))}</span>` : ""}</div>
          <div class="meta">${esc(unitLabel(u))} · ${esc(sizeLabel(u.area, first.supply))}${u.dir ? " · " + esc(dirLabel(u.dir)) : ""}</div>
          <div class="meta tiny">${tags.map(esc).join(" · ")}</div></div>
        <div class="side"><div>${days(u.firstSeen, now)}일째</div><div class="muted tiny">중개 ${ls.length}곳</div></div></div>`;
    }).join("");
    const last = [...S.snaps].reverse().find(s => s.cx === filterCx);
    el.innerHTML = cxChips(filterCx) +
      `<div class="card"><h2>매매 매물 ${us.length}집 <span class="muted small">(${Object.values(S.listings).filter(l => l.cx === filterCx).length}건)</span>
        <a class="more" href="${NAVER_COMPLEX(filterCx)}" target="_blank" rel="noopener">네이버에서</a></h2>
        <div class="tiny muted" style="margin-bottom:4px">같은 집을 여러 중개사가 올리면 한 집으로 묶어요. ${last ? `마지막 확인 ${ago(last.t)}${last.ok ? "" : " (실패: " + esc(last.err) + ")"}` : ""}</div>
        ${rows || `<div class="empty">지금 올라온 매물이 없어요</div>`}</div>`;
    bindChips(el, "cx", v => { filterCx = v; renderList(); });
    el.querySelectorAll("[data-unit]").forEach(r => r.addEventListener("click", () => openUnit(r.dataset.unit)));
  }

  function openUnit(key) {
    const u = S.units[key] || S.gone.slice().reverse().find(g => g.unit === key);
    if (!u) { toast("이 집의 기록이 남아 있지 않아요"); return; }
    const ls = S.units[key] ? listingsOf(u) : [];
    // a flat that went: the listings as last seen (they may be gone from Naver too)
    const last = !ls.length ? (u.lastListings || []) : [];
    $("#unitTitle").textContent = `${nameOfNo(u.cx)} ${unitLabel(u)}`;
    const hist = ls.flatMap(l => l.history.map(h => ({ ...h, by: l.realtor }))).sort((a, b) => a.t - b.t);
    const trades = DATA.trades.filter(t => cfg.links[t.cx] && String(cfg.links[t.cx].no) === u.cx && Math.abs(t.area - (u.area || 0)) <= 1).slice(-6).reverse();
    const supply = (ls[0] || {}).supply || u.supply;
    $("#unitBody").innerHTML = `
      <dl class="kv"><dt>면적</dt><dd>${esc(areaLabel(u.area, supply))}</dd><dt>방향</dt><dd>${esc(dirLabel(u.dir) || "-")}</dd>
        <dt>처음 본 날</dt><dd>${dfull(u.firstSeen)} (${fmt(u.firstPrice)})</dd><dt>마지막 본 날</dt><dd>${dfull(u.lastSeen)} (${fmt(u.lastPrice)})</dd>
        ${u.status ? `<dt>상태</dt><dd><span class="badge ${STATUS[u.status]}">${esc(u.status)}</span>${u.trade ? ` ${esc(u.trade.date)} ${fmt(u.trade.price)} · ${u.trade.floor}층` : ""}</dd>` : ""}</dl>
      ${u.trade ? `<button class="btn" id="toTrade" style="margin-top:12px">실거래 탭에서 보기</button>` : ""}
      ${ls.length ? `<h4 style="margin:16px 0 4px">올린 중개사 ${ls.length}곳</h4>` + ls.map(l => `<div class="row"><div class="main">
          <div><b>${esc(l.priceText)}</b> <span class="small muted">${esc(l.realtor)}</span></div>
          <div class="meta">${esc(l.desc || "")}</div><div class="meta tiny">확인 ${esc(l.confirmed)}</div></div>
          <a class="small" href="${NAVER_ARTICLE(l.no)}" target="_blank" rel="noopener">보기</a></div>`).join("") : ""}
      ${last.length ? `<h4 style="margin:16px 0 4px">마지막으로 본 매물 ${last.length}건 <span class="small muted">(${dfull(u.lastSeen)})</span></h4>` + last.map(l => `<div class="row"><div class="main">
          <div><b>${esc(l.priceText)}</b> <span class="small muted">${esc(l.realtor)}</span></div>
          <div class="meta">${esc(l.desc || "")}</div>${l.confirmed ? `<div class="meta tiny">확인 ${esc(l.confirmed)}</div>` : ""}</div>
          <a class="small" href="${NAVER_ARTICLE(l.no)}" target="_blank" rel="noopener">네이버</a></div>`).join("")
        : !ls.length ? `<div class="small muted" style="margin-top:12px">이 집이 사라지기 전 매물 내용은 이 기능이 생기기 전이라 남아 있지 않아요.</div>` : ""}
      ${hist.length > ls.length ? `<h4 style="margin:16px 0 4px">가격 기록</h4><ul class="list-plain">${hist.map(h => `<li>${dfull(h.t)} ${fmt(h.price)} <span class="muted">${esc(h.by)}</span></li>`).join("")}</ul>` : ""}
      ${trades.length ? `<h4 style="margin:16px 0 4px">같은 면적 실거래</h4>${trades.map(t => tradeRow(t, matchedTrades())).join("")}` : ""}`;
    const go = $("#toTrade");
    if (go) go.onclick = () => {
      const key = keyOfNo(u.cx);
      tradeKey = key; tradeArea = String(Math.round(u.trade.area)); tradeFocus = `${key}|${u.trade.date}|${u.trade.price}|${u.trade.floor}`;
      $("#unitDlg").close(); showTab("trades");
    };
    $("#unitDlg").showModal();
  }

  function renderGone() {
    const el = $("#panel-gone");
    if (!native) { el.innerHTML = appNote() + explainGone(); return; }
    const sel = filterCx && linked().length > 1 ? filterCx : null;
    let gs = S.gone.filter(g => keyOfNo(g.cx) && (!sel || g.cx === sel));
    const counts = { all: gs.length, "거래 추정": 0, "실거래 확인": 0, "재등록": 0 };
    gs.forEach(g => counts[g.status]++);
    if (goneFilter !== "all") gs = gs.filter(g => g.status === goneFilter);
    gs = gs.slice().sort((a, b) => b.lastSeen - a.lastSeen);
    const rows = gs.map(g => `<div class="row tap" data-gone="${esc(g.unit)}"><div class="main">
        <div><span class="badge ${STATUS[g.status]}">${esc(g.status)}</span> ${g.trade
          ? `<b class="price" style="font-size:15px">${fmt(g.trade.price)}</b> <span class="tiny muted">실거래 · 호가 ${fmt(g.lastPrice)}</span>`
          : `<b class="price" style="font-size:15px">${fmt(g.lastPrice)}</b> <span class="tiny muted">호가${g.firstPrice && g.lastPrice && g.firstPrice !== g.lastPrice ? ` (처음 ${fmt(g.firstPrice)})` : ""}</span>`}</div>
        <div class="meta">${esc(nameOfNo(g.cx))} ${esc(unitLabel(g))} · ${esc(sizeLabel(g.area, g.supply))}</div>
        <div class="meta tiny">${g.trade ? `실거래 ${esc(g.trade.date)} ${fmt(g.trade.price)} (${g.trade.floor}층)` : g.status === "재등록" ? `${dshort(g.backAt)} 다시 올라옴` : "실거래 신고를 기다리는 중 (계약 후 30일 안)"}</div></div>
      <div class="side"><div>${dshort(g.lastSeen)}</div><div class="muted tiny">${days(g.firstSeen, g.lastSeen)}일 걸림</div></div></div>`).join("");
    el.innerHTML = cxChips(sel, true) +
      `<div class="chips">${[["all", "전체"], ["거래 추정", "거래 추정"], ["실거래 확인", "실거래 확인"], ["재등록", "재등록"]].map(([k, l]) =>
        `<button class="chip" data-gf="${k}" aria-pressed="${goneFilter === k}">${l} ${counts[k]}</button>`).join("")}</div>
      ${watching(sel)}
      <div class="card">${rows || `<div class="empty">아직 사라진 매물이 없어요.<br>매일 한 번쯤 앱을 열거나 백그라운드 확인을 켜 두면 기록이 쌓여요.</div>`}</div>` + explainGone();
    bindChips(el, "cx", v => { filterCx = v || null; renderGone(); });
    bindChips(el, "gf", v => { goneFilter = v; renderGone(); });
    el.querySelectorAll("[data-gone]").forEach(r => r.addEventListener("click", () => openUnit(r.dataset.gone)));
  }

  // flats missing from the latest checks but not yet long enough to be 「거래 추정」 (what a 「사라짐」 alert is about)
  function watching(sel) {
    const now = Date.now();
    const us = Object.values(S.units).filter(u => u.misses > 0 && keyOfNo(u.cx) && (!sel || u.cx === sel))
      .sort((a, b) => a.lastSeen - b.lastSeen);
    if (!us.length) return "";
    return `<div class="card"><h2>지켜보는 중 <span class="muted small">${us.length}집</span></h2>
      <div class="tiny muted" style="margin-bottom:4px">최근 확인에서 안 보인 집이에요. 두 번 연속, 20시간 넘게 안 보이면 「거래 추정」으로 옮겨요. 그 전에 다시 보이면 목록에 그대로 있어요.</div>
      ${us.map(u => {
        const h = Math.floor((now - u.lastSeen) / 3600e3), left = Math.max(0, 20 - h);
        return `<div class="row tap" data-gone="${esc(u.key)}"><div class="main">
          <div><span class="badge b-back">안 보임</span> <b class="price" style="font-size:15px">${fmt(u.lastPrice)}</b></div>
          <div class="meta">${esc(nameOfNo(u.cx))} ${esc(unitLabel(u))} · ${esc(sizeLabel(u.area, u.supply))}</div>
          <div class="meta tiny">${h}시간째 안 보여요 (확인 ${u.misses}번)${u.misses >= 2 && left === 0 ? " · 다음 확인에서 거래 추정" : ` · ${u.misses < 2 ? "한 번 더 확인하고" : ""}${left ? ` 약 ${left}시간 뒤` : ""} 거래 추정`}</div></div>
          <div class="side muted">${dshort(u.lastSeen)}</div></div>`;
      }).join("")}</div>`;
  }

  function explainGone() {
    return `<div class="card small"><h2>어떻게 추정하나요?</h2><ul class="list-plain">
      <li>같은 동·층·면적·방향 매물은 중개사가 여럿이어도 <b>한 집</b>으로 봐요. 층을 「22층」과 「고층」으로 다르게 적어도 가격이 비슷하면 같은 집이에요.</li>
      <li>그 집의 매물이 모두 <b>두 번 연속, 20시간 넘게</b> 안 보이면 <span class="badge b-guess">거래 추정</span>이에요.</li>
      <li>그 무렵(30일 전~20일 뒤, 처음 본 날보다 1주 넘게 앞서지 않게) 같은 면적·층에서 호가의 90~103%로 신고된 실거래가 있으면 <span class="badge b-ok">실거래 확인</span>이에요.</li>
      <li>3주 안에 다시 올라오면 거래가 아니라 내렸다 올린 것이라 <span class="badge b-back">재등록</span>으로 바꿔요.</li>
      <li>네이버가 잠깐 막아서 0건이 오면 바로 믿지 않고 다음 확인까지 기다려요.</li></ul></div>`;
  }

  // the trades a disappeared listing was matched to (complex key|date|price|floor)
  const matchedTrades = () => new Set(S.gone.filter(g => g.trade && keyOfNo(g.cx)).map(g => `${keyOfNo(g.cx)}|${g.trade.date}|${g.trade.price}|${g.trade.floor}`));
  let tradeFocus = null;   // the trade opened from 거래 추정, highlighted on 실거래
  function tradeRow(t, hits) {
    const c = byKey(t.cx);
    const id = `${t.cx}|${t.date}|${t.price}|${t.floor}`, hit = hits && hits.has(id);
    return `<div class="row" ${tradeFocus === id ? 'id="tradeFocus" style="background:var(--ok-soft);border-radius:10px;padding-left:8px;padding-right:8px"' : ""}><div class="main"><div class="price ${t.cancelled ? "strike" : ""}" style="font-size:15px">${fmt(t.price)}
        ${hit ? `<span class="badge b-ok">사라진 매물</span>` : ""}
        ${t.cancelled ? `<span class="badge b-back">해제 ${esc(t.cancelDate || "")}</span>` : ""}${t.gbn === "직거래" ? ` <span class="badge b-back">직거래</span>` : ""}</div>
      <div class="meta">${esc(shortName(c))} ${t.aptDong ? esc(t.aptDong) + "동 " : ""}${t.floor}층 · ${t.area.toFixed(1)}㎡</div></div>
      <div class="side muted">${esc(t.date.replace(/-/g, "."))}</div></div>`;
  }

  function areaGroups(trades) {
    const g = {};
    for (const t of trades) { const k = Math.round(t.area); g[k] = (g[k] || 0) + 1; }
    return Object.keys(g).map(Number).sort((a, b) => a - b);
  }

  function tradeChart(trades, asks) {
    if (trades.length < 2) return "";
    // asking prices get their own column on the right, apart from the trades, so they are not read as deals
    const W = 340, H = 180, L = 40, R = asks.length ? 54 : 8, Tp = 14, B = 22;
    const now = Date.now(), from = now - 3 * 365 * DAY;
    const pts = trades.filter(t => Date.parse(t.date) >= from && t.price);
    if (pts.length < 2) return "";
    const prices = pts.map(t => t.price).concat(asks.map(a => a.price));
    let lo = Math.min(...prices), hi = Math.max(...prices);
    const pad = Math.max(1000, (hi - lo) * 0.1); lo -= pad; hi += pad;
    const x = t => L + ((t - from) / (now - from)) * (W - L - R), y = p => Tp + (1 - (p - lo) / (hi - lo)) * (H - Tp - B);
    let g = "";
    for (let i = 0; i <= 3; i++) {
      const p = lo + (hi - lo) * i / 3;
      g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(p).toFixed(1)}" y2="${y(p).toFixed(1)}"/><text x="${L - 4}" y="${(y(p) + 3).toFixed(1)}" text-anchor="end">${(p / 10000).toFixed(1)}억</text>`;
    }
    for (let k = 0; k <= 3; k++) {
      const yr = new Date(from).getFullYear() + k, t = Date.parse(`${yr}-01-01`);
      if (t > from && t < now) g += `<text x="${x(t).toFixed(1)}" y="${H - 6}" text-anchor="middle">${yr}</text>`;
    }
    const hitIds = new Set(S.gone.filter(g => g.trade).map(g => g.trade.date + "|" + g.trade.price + "|" + g.trade.floor));
    const dots = pts.map(t => `<circle class="dot ${t.cancelled ? "cancel" : hitIds.has(t.date + "|" + t.price + "|" + t.floor) ? "hit" : ""}" cx="${x(Date.parse(t.date)).toFixed(1)}" cy="${y(t.price).toFixed(1)}" r="3.6"><title>${esc(t.date)} ${fmt(t.price)} ${t.floor}층</title></circle>`).join("");
    let askCol = "", askLine = "";
    if (asks.length) {
      const ap = asks.map(a => a.price), amin = Math.min(...ap), amax = Math.max(...ap), cx = W - R / 2 + 4;
      askCol = `<line x1="${W - R + 6}" x2="${W - R + 6}" y1="${Tp}" y2="${H - B}" class="grid" stroke-dasharray="3 3"/>
        <text x="${cx}" y="${Tp - 3}" text-anchor="middle" style="fill:var(--warn);font-weight:700">호가</text>
        <line x1="${cx}" x2="${cx}" y1="${y(amax).toFixed(1)}" y2="${y(amin).toFixed(1)}" style="stroke:var(--warn);stroke-width:2;opacity:.5"/>` +
        asks.map(a => `<rect class="ask" x="${cx - 6}" y="${(y(a.price) - 1.5).toFixed(1)}" width="12" height="3"><title>호가 ${fmt(a.price)}</title></rect>`).join("");
      askLine = `<div class="small" style="margin-top:6px"><b style="color:var(--warn)">지금 호가</b> (네이버 매물, 거래 아님) ${amin === amax ? fmt(amin) : `${fmt(amin)} ~ ${fmt(amax)}`} · ${asks.length}집</div>`;
    }
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 3년 실거래가와 지금 호가">${g}${dots}${askCol}</svg>
      <div class="legend"><span><i style="background:var(--accent)"></i>실거래</span><span><i style="background:var(--ok)"></i>사라진 매물과 맞은 거래</span>
      <span><i style="border:1px solid var(--muted)"></i>해제</span>${asks.length ? `<span><i style="background:var(--warn);border-radius:1px"></i>지금 호가(오른쪽 칸)</span>` : ""}</div>${askLine}`;
  }

  function renderTrades() {
    const el = $("#panel-trades");
    if (!tradeKey) tradeKey = mainCx() ? mainCx().key : null;
    const all = DATA.trades.filter(t => t.cx === tradeKey);
    const groups = areaGroups(all);
    if (tradeArea !== "all" && !groups.includes(+tradeArea)) tradeArea = "all";
    const ts = all.filter(t => tradeArea === "all" || Math.round(t.area) === +tradeArea);
    const no = cfg.links[tradeKey]?.no ? String(cfg.links[tradeKey].no) : null;
    const asks = no ? unitsOf(no).filter(u => u.lastPrice && (tradeArea === "all" || Math.round(u.area) === +tradeArea)).map(u => ({ price: u.lastPrice })) : [];
    const y1 = ts.filter(t => !t.cancelled && Date.parse(t.date) > Date.now() - 365 * DAY);
    let h = `<div class="chips">${DATA.complexes.map(c => `<button class="chip" data-tk="${esc(c.key)}" aria-pressed="${c.key === tradeKey}">${esc(shortName(c))}</button>`).join("")}</div>`;
    if (groups.length > 1) h += `<div class="chips"><button class="chip" data-ta="all" aria-pressed="${tradeArea === "all"}">전체 면적</button>${groups.map(a => `<button class="chip" data-ta="${a}" aria-pressed="${String(a) === String(tradeArea)}">전용 ${a}㎡</button>`).join("")}</div>`;
    h += `<div class="card"><h2>실거래 ${ts.length}건</h2>
      <div class="stats" style="margin-bottom:10px"><div class="stat"><b>${y1.length}</b><span>최근 1년 거래</span></div>
        <div class="stat"><b>${y1.length ? fmt(Math.max(...y1.map(t => t.price))) : "-"}</b><span>1년 실거래 최고</span></div>
        <div class="stat"><b>${ts.length ? fmt(ts.filter(t => !t.cancelled).at(-1)?.price) : "-"}</b><span>마지막 거래</span></div></div>
      ${tradeChart(ts, asks)}</div>
      <div class="card">${(() => { const hits = matchedTrades(); return ts.slice().reverse().slice(0, 120).map(t => tradeRow(t, hits)).join(""); })() || `<div class="empty">${DATA.tradeMonths && DATA.tradeMonths.length ? "거래 기록이 없어요" : "실거래 자료를 아직 받지 않았어요.<br>저장소 Secret에 MOLIT_KEY를 넣으면 매일 받아요 (apt/README.md)."}</div>`}</div>
      <div class="tiny muted">국토교통부 아파트 매매 실거래가 (공공데이터포털). 계약 후 30일 안에 신고돼서 최근 거래는 늦게 보여요.</div>`;
    el.innerHTML = h;
    const focus = $("#tradeFocus");
    if (focus) { setTimeout(() => focus.scrollIntoView({ block: "center", behavior: "smooth" }), 50); tradeFocus = null; }
    bindChips(el, "tk", v => { tradeKey = v; tradeArea = "all"; renderTrades(); });
    bindChips(el, "ta", v => { tradeArea = v; renderTrades(); });
  }

  function postRow(p) {
    return `<div class="row"><div class="main"><a href="${esc(p.url)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">
      <div class="small" style="font-weight:600">${esc(p.title)}</div></a><div class="meta tiny">${esc(p.blog)} · ${p.cx.map(k => esc(shortName(byKey(k)))).join(", ")}</div></div>
      <div class="side muted tiny">${esc(p.date.replace(/(\d{4})(\d\d)(\d\d)/, "$1.$2.$3"))}</div></div>`;
  }

  function renderNews() {

    el.innerHTML = `<div class="chips"><button class="chip" data-nk="all" aria-pressed="${newsKey === "all"}">전체</button>${DATA.complexes.map(c =>
        `<button class="chip" data-nk="${esc(c.key)}" aria-pressed="${newsKey === c.key}">${esc(shortName(c))}</button>`).join("")}</div>

      <div class="card">${ps.slice(0, 150).map(postRow).join("") || `<div class="empty">글이 없어요</div>`}</div>
      <div class="tiny muted">네이버 블로그 검색 (${esc(DATA.blogUpdated || "-")}) · 제목과 링크만 모아요.</div>`;

          <select id="dailyAt">${["07:00", "08:00", "09:00", "10:00", "12:00", "18:00", "21:00"].map(t => `<option ${cfg.dailyAt === t ? "selected" : ""}>${t}</option>`).join("")}</select></label>

        <details class="small" ${snaps[0] && !snaps[0].ok ? "open" : ""}><summary>최근 확인 기록</summary><ul class="list-plain">${snaps.map(s => `<li>${dfull(s.t)} ${new Date(s.t).toTimeString().slice(0, 5)} ${esc(s.cx === "discover" ? "단지 찾기" : nameOfNo(s.cx))}: ${s.ok ? (s.cx === "discover" ? `단지 ${s.count}곳, 새로 연결 ${s.units}` : `매물 ${s.count}건 (${s.units}집)${s.src === "지도" ? " · 지도 목록" : s.src === "fin" ? " · 새 네이버 목록" : ""}`) : `<span class="up">${esc(s.err)}</span>`}</li>`).join("") || "<li>아직 없어요</li>"}</ul></details>

      <label class="field">화면 밝기

      <h4 style="margin:20px 0 2px">자료</h4>
      <div class="small muted">실거래 ${esc(DATA.tradesUpdated || "받지 않음")} · 블로그 ${esc(DATA.blogUpdated || "-")} · 화면 버전 __VERSION__</div>
      ${DATA.otherNames && DATA.otherNames.length ? `<details class="small"><summary>반송동의 다른 단지 이름 (실거래)</summary><div class="tiny muted">우리 단지가 여기 있으면 apt/data/complexes.json의 molit 패턴을 고쳐야 해요: ${DATA.otherNames.map(esc).join(", ")}</div></details>` : ""}
      <p class="tiny muted" style="margin-top:16px">네이버 부동산 매물은 이 폰이 사람이 보는 정도로 천천히 읽고, 어디에도 올리지 않아요. 거래 추정은 추정일 뿐이에요.</p>`;
    b.querySelectorAll("[data-unlink]").forEach(x => x.addEventListener("click", () => { delete cfg.links[x.dataset.unlink]; saveCfg(); renderSettings(); renderAll(); }));
    $("#themeSel").onchange = e => {
      const t = e.target.value; lset("aw-theme", t);
      const dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
      if (t === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
      $("#themeColor").content = dark ? "#111418" : "#f4f6f8";
    };
    if (!native) return;
    $("#findBtn").onclick = async () => {
      $("#findBtn").disabled = true; $("#foundList").innerHTML = `<div class="small muted">찾는 중…</div>`;
      try { const n = await discoverAndLink(); toast(n ? `${n}개 단지를 연결했어요` : "이미 연결돼 있어요"); renderSettings(); showFound(); refresh(); }
      catch (e) {
        T.recordFailure(S, "discover", Date.now(), e.message); saveState();
        renderSettings();
        if (found && found.length) showFound();
        $("#foundList").insertAdjacentHTML("afterbegin", `<div class="small up" style="margin:6px 0">${esc(e.message)}<br>아래 「네트워크 진단」을 캡처해 보내 주세요.</div>`);

    };

      const no = parseNaverLink($("#linkInput").value);

      const key = $("#linkKey").value;

      cfg.links[key] = { no, name }; saveCfg(); toast(`${byKey(key).name} ← ${name || no}`); renderSettings(); refresh(true);
    };
    $("#dailyChk").onchange = e => { cfg.daily = e.target.checked; saveCfg(); scheduleBackground().then(showDailyState); };
    $("#dailyAt").onchange = e => { cfg.dailyAt = e.target.value; saveCfg(); scheduleBackground().then(showDailyState); toast(`매일 ${cfg.dailyAt}에 요약을 보내요`); };
    $("#hoursSel").onchange = e => { cfg.hours = +e.target.value; saveCfg(); scheduleBackground(); };
    $("#notifyChk").onchange = async e => {
      cfg.notify = e.target.checked; saveCfg();
      if (cfg.notify) { try { await ncall("LocalNotifications", "requestPermissions"); } catch (x) {} }
      scheduleBackground();
    };
    const askPermission = async () => {
      try {
        const st = await ncall("AptNet", "notifyStatus");
        if (st && !st.enabled) { await ncall("AptNet", "askNotify"); showNotifyState(); return false; }
        return true;
      } catch (e) { /* an older app */ }
      try {
        const r = await ncall("LocalNotifications", "requestPermissions");
        if (r && r.display && r.display !== "granted") { $("#testNote").textContent = "알림이 꺼져 있어요: 폰 설정 → 애플리케이션 → 우리 단지 거래 추적 → 알림을 켜 주세요."; return false; }
      } catch (e) {}
      return true;
    };
    showNotifyState(); showWorkerState(); scheduleBackground().then(showDailyState);
    $("#testNotifyBtn").onclick = async () => {
      if (!(await askPermission())) return;
      try { await ncall("AptNet", "testNotify", { text: "시험 알림 · KCC스위첸: 사라짐 1 · 새 매물 1 (이렇게 와요)" }); $("#testNote").textContent = "알림을 보냈어요. 안 보이면 폰 설정에서 이 앱의 알림을 켜 주세요."; }
      catch (e) { $("#testNote").textContent = "이 앱 버전에는 없는 기능이에요. 앱을 업데이트해 주세요."; }
    };
    $("#testChangeBtn").onclick = async () => {
      if (!(await askPermission())) return;
      try {
        await scheduleBackground();
        const r = await ncall("AptNet", "testChange");
        $("#testNote").textContent = "백그라운드 확인을 지금 돌렸어요. 1~3분 안에 「백그라운드 확인 시험」 알림이 와요. 알림에 단지마다 몇 건 읽었는지, 오류가 있었는지 적혀 있어요"
          + (r && r.complexes ? ` (지난 기록에서 단지 ${r.complexes}곳의 한 집씩을 빼 두어서 「새 매물 1」도 잡혀야 해요).` : ".");
        watchWorker(Date.now());
      } catch (e) { $("#testNote").textContent = "이 앱 버전에는 없는 기능이에요. 앱을 업데이트해 주세요."; }
    };
    $("#runNowBtn").onclick = async () => { watchWorker(Date.now());
      try { await scheduleBackground(); await ncall("AptNet", "runNow"); toast("몇 분 안에 확인해요. 지난번과 달라진 게 있으면 알림이 와요"); }
      catch (e) { toast("이 앱 버전에는 없는 기능이에요. 앱을 업데이트해 주세요"); }
    };
    $("#exportBtn").onclick = exportState;
    $("#importFile").onchange = e => importState(e.target.files[0]);
  }
  function showDailyState() {
    const el = $("#dailyState"); if (!el || !dailyState) return;
    const d = dailyState, when = d.next ? new Date(d.next) : null;
    const day = when ? (when.toDateString() === new Date().toDateString() ? "오늘" : "내일") : "";
    el.innerHTML = (cfg.daily && when ? `다음 요약: ${day} ${when.toTimeString().slice(0, 5)}${d.exact ? "" : " 무렵"}` : "아침 요약 꺼짐") +
      (cfg.daily && !d.battery ? `<br><span class="up">배터리 최적화가 켜져 있어 늦게 올 수 있어요</span> <button class="btn ghost small" id="powerBtn">최적화에서 빼기</button>` : "") +
      (cfg.daily && !d.exact ? `<br><span class="up">정확한 시간 알람이 꺼져 있어요</span> <button class="btn ghost small" id="alarmBtn">알람 허용</button>` : "");
    const p = $("#powerBtn"), a = $("#alarmBtn");
    if (p) p.onclick = async () => { await ncall("AptNet", "askPower", { what: "battery" }); setTimeout(async () => { await scheduleBackground(); showDailyState(); }, 5000); };
    if (a) a.onclick = async () => { await ncall("AptNet", "askPower", { what: "alarm" }); setTimeout(async () => { await scheduleBackground(); showDailyState(); }, 5000); };
  }

  async function showNotifyState() {
    const el = $("#notifyState"); if (!el) return;
    try {
      const st = await ncall("AptNet", "notifyStatus");
      el.innerHTML = st.enabled ? `알림: <b class="down">켜져 있어요</b>`
        : `알림: <b class="up">꺼져 있어요</b> ${st.permission ? "(「매물 변화」 알림 채널이 꺼져 있어요)" : "(알림 권한이 없어요)"} <button class="btn ghost small" id="notifyOnBtn">알림 켜기</button>`;
      const b = $("#notifyOnBtn");
      if (b) b.onclick = async () => { await ncall("AptNet", "askNotify"); setTimeout(showNotifyState, 4000); };
    } catch (e) { el.textContent = ""; }
  }
  async function showWorkerState() {
    const el = $("#workerState"); if (!el) return null;
    try {
      const w = await ncall("AptNet", "workerStatus"), l = w.last || {};
      if (!l.t) { el.textContent = w.start ? `백그라운드 확인: ${ago(w.start)} 시작, 아직 끝난 기록이 없어요` : "백그라운드 확인: 아직 한 번도 안 돌았어요"; return w; }
      const jobs = (l.jobs || []).map(j => `${esc(j.name)} ${j.ok ? `${j.count}건${j.change ? " · " + esc(j.change) : ""}` : `<span class="up">오류 ${esc(j.err)}</span>`}`).join(" / ");
      el.innerHTML = `백그라운드 확인: ${ago(l.t)} · ${jobs || "단지 없음"} · ${l.sent ? "알림 보냄" : l.wanted ? '<span class="up">알림을 못 보냈어요</span>' : "알림 없음(변화 없음)"}`;
      return w;
    } catch (e) { el.textContent = ""; return null; }
  }
  // after a test: show the background check's result as soon as it lands (for 3 minutes)
  let watchTimer = null;
  function watchWorker(since) {
    clearInterval(watchTimer);
    const stop = Date.now() + 180e3;
    watchTimer = setInterval(async () => {
      const w = await showWorkerState();
      if (!$("#settingsDlg").open || Date.now() > stop || (w && w.last && w.last.t > since)) clearInterval(watchTimer);
    }, 5000);
  }

  function showFound() {
    const used = new Set(Object.values(cfg.links).map(l => String(l.no)));
    $("#foundList").innerHTML = `<div class="tiny muted" style="margin-top:4px">주변 단지 ${found.length}곳 (눌러서 위 「어느 단지」에 연결)</div>` +
      found.map(f => `<div class="row tap" data-pick="${esc(f.no)}"><div class="main small">${esc(f.name)} ${used.has(f.no) ? '<span class="badge b-ok">연결됨</span>' : ""}</div><div class="side tiny muted">${f.hh ? f.hh + "세대" : ""}${f.deals != null ? ` · 매매 ${f.deals}` : ""}</div></div>`).join("");
    $("#foundList").querySelectorAll("[data-pick]").forEach(r => r.addEventListener("click", () => {
      const f = found.find(x => x.no === r.dataset.pick), key = $("#linkKey").value;
      cfg.links[key] = { no: f.no, name: f.name, hh: f.hh, lat: f.lat, lng: f.lng, approx: f.approx, deals: f.deals }; saveCfg(); toast(`${byKey(key).name} ← ${f.name}`); renderSettings(); refresh(true);
    }));
  }

  async function exportState() {
    const text = JSON.stringify({ app: "apt-watch", at: new Date().toISOString(), cfg: { links: cfg.links }, state: S });
    const name = `apt-watch-${new Date().toISOString().slice(0, 10)}.json`;
    try {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([text], { type: "application/json" })); a.download = name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    } catch (e) { /* below */ }
    if (native) { try { await ncall("Share", "share", { title: name, text }); } catch (e) {} }
  }
  async function importState(file) {
    if (!file) return;
    try {
      const j = JSON.parse(await file.text());
      if (j.app !== "apt-watch" || !j.state || !j.state.units) throw new Error();
      if (!confirm("지금 기록을 이 파일 내용으로 바꿀까요?")) return;
      S = Object.assign(T.emptyState(), j.state); cfg.links = Object.assign({}, j.cfg?.links || {}); cfg.scheduled = "";
      saveState(); saveCfg(); toast("기록을 가져왔어요"); renderSettings(); renderAll(); scheduleBackground();
    } catch (e) { toast("이 앱에서 내보낸 파일이 아니에요"); }
  }

  /* ===================== app update (Android) ===================== */
  const RELEASE_API = "https://api.github.com/repos/YoSebChoi/YoSebChoi/releases/tags/apt-apk";
  let lastCheck = 0;
  async function checkAppUpdate() {
    if (!native || Date.now() - lastCheck < 10 * 60 * 1000 || $("#appUpdate").open) return;
    lastCheck = Date.now();
    try {
      const info = await ncall("App", "getInfo");
      const cur = parseInt(info && info.build, 10) || 0;
      const res = await fetch(RELEASE_API, { cache: "no-store", headers: { Accept: "application/vnd.github+json" } });
      if (!res.ok) return;
      const rel = await res.json();
      const m = /빌드\s*(\d+)/.exec(rel.body || ""), latest = m ? +m[1] : 0;
      const apk = (rel.assets || []).find(a => a.name === "apt-watch.apk");
      if (!apk || latest <= cur) return;
      showAppUpdate(apk.browser_download_url);
    } catch (e) { /* offline or rate-limited: try again next time */ }
  }
  function showAppUpdate(url) {
    const dlg = $("#appUpdate"), go = $("#appUpdateGo"), text = $("#appUpdateText"), bar = $("#appUpdateBar");
    text.textContent = "업데이트해도 매물 기록과 설정은 그대로 남아요. 설치 화면이 뜨면 「업데이트」를 눌러 주세요.";
    bar.hidden = true; go.disabled = false; go.textContent = "지금 업데이트";
    dlg.showModal();
    $("#appUpdateLater").onclick = () => dlg.close();
    go.onclick = async () => {
      go.disabled = true; go.textContent = "받는 중…"; bar.hidden = false;
      let sub = null;
      try {
        sub = await nlisten("AptUpdate", "progress", p => {
          if (p && p.percent >= 0) { bar.firstElementChild.style.width = p.percent + "%"; go.textContent = `받는 중… ${p.percent}%`; }
        });
        const r = await ncall("AptUpdate", "install", { url });
        if (r && r.needsPermission) {
          text.textContent = "처음 한 번만, 열린 설정 화면에서 「이 출처 허용」을 켜고 돌아와 다시 눌러 주세요.";
          bar.hidden = true; go.disabled = false; go.textContent = "지금 업데이트";
        } else {
          text.textContent = "설치 화면에서 「업데이트」를 누르면 끝나요.";
          go.textContent = "설치 화면 열림";
        }
      } catch (e) {
        text.textContent = "새 버전을 받지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.";
        bar.hidden = true; go.disabled = false; go.textContent = "다시 시도";
      } finally { try { sub && sub.remove && sub.remove(); } catch (e) {} }
    };
  }

  /* ===================== tabs ===================== */
  const TABS = ["home", "list", "gone", "trades", "news"];
  let tab = "home";
  const RENDER = { home: renderHome, list: renderList, gone: renderGone, trades: renderTrades, news: renderNews };
  function showTab(name) {
    tab = name;
    for (const t of TABS) { $("#panel-" + t).hidden = t !== name; $("#tab-" + t).setAttribute("aria-selected", String(t === name)); }
    RENDER[name]();
    window.scrollTo({ top: 0 });
  }
  function renderAll() {
    const m = mainCx();
    $("#title").textContent = m ? shortName(m) + " 거래 추적" : "우리 단지 거래 추적";
    setStatus(statusLine());
    RENDER[tab]();
  }
  document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));
  document.querySelectorAll("dialog [data-close]").forEach(b => b.addEventListener("click", () => b.closest("dialog").close()));
  document.querySelectorAll("dialog").forEach(d => d.addEventListener("click", e => { if (e.target === d && d.id !== "appUpdate") d.close(); }));
  $("#settingsBtn").addEventListener("click", () => { renderSettings(); $("#settingsDlg").showModal(); });
  $("#refreshBtn").addEventListener("click", () => refresh(true));
  if (native) {
    $("#refreshBtn").hidden = false;
    nlisten("App", "backButton", () => {
      if (!$("#toast").hidden) $("#toast").hidden = true;
      const open = document.querySelector("dialog[open]");
      if (open) { open.close(); return; }
      if (tab !== "home") { showTab("home"); return; }
      ncall("App", "minimizeApp").catch(() => {});
    });
    nlisten("App", "resume", () => { refresh(); checkAppUpdate(); });
  }

  /* ===================== start ===================== */
  // GitHub Pages lets a page sit in caches for up to 10 minutes after a release: when the published
  // version is newer than this one, load it straight away (a new address skips those caches)
  async function freshPage() {
    try {
      const v = (await (await fetch(`version.txt?t=${Date.now()}`, { cache: "no-store" })).text()).trim();
      if (v && v !== "__VERSION__" && /^[0-9a-f]{6,}$/.test(v) && new URLSearchParams(location.search).get("v") !== v) {
        location.replace(`index.html?v=${v}${location.hash}`);
        return true;
      }
    } catch (e) { /* offline: this page will do */ }
    return false;
  }
  (async () => {
    if (native && await freshPage()) return;
    try {
      const res = await fetch("data.json", { cache: "no-cache" });
      DATA = Object.assign(DATA, await res.json());
    } catch (e) { toast("자료를 불러오지 못했어요"); }
    renderAll();
    if (native) { T.repairPrices(S); matchTrades(); saveState(); refresh(); setTimeout(checkAppUpdate, 3000); }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  })();
  window.__aptwatch = { get S() { return S; }, get cfg() { return cfg; }, refresh };
})();
</script>

<script>
// offline copy for the browser; the Android app (apt-app/) always loads the live page so the native bridge is injected
(() => {
  if (!("serviceWorker" in navigator)) return;
  if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
    navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
    return;
  }
  addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
})();
</script>
